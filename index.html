<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慧铭AI语音助手 V5.6 - Pi测试网</title>
    <!-- Pi官方SDK，必须保留 -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .status-box {
            margin-top: 30px;
            padding: 15px;
            border-radius: 8px;
            background-color: #f5f5f5;
        }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <h1>慧铭AI语音助手 V5.6</h1>
    <p>Pi Network 测试网专属版本</p >

    <div class="status-box">
        <p id="status">正在连接Pi网络，等待登录...</p >
    </div>

    <script>
        // 初始化Pi SDK（测试网必须开sandbox）
        Pi.init({
            version: "2.0",
            sandbox: true
        });

        // 触发登录认证
        function authenticateUser() {
            Pi.authenticate(
                ["username", "payments"],
                function onSuccess(authResult) {
                    document.getElementById("status").className = "success";
                    document.getElementById("status").innerText = 
                        "✅ 登录成功！欢迎使用慧铭AI V5.6\n用户ID：" + authResult.user.uid;
                },
                function onError(error) {
                    document.getElementById("status").className = "error";
                    document.getElementById("status").innerText = 
                        "❌ 登录失败：" + error.message;
                }
            );
        }

        // 页面加载完成自动触发登录
        window.onload = function() {
            authenticateUser();
        };
    </script>
</body>
</html>
