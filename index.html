<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慧铭AI语音助手 V5.6 - Pi测试网</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .status-box {
            margin-top: 30px;
            padding: 15px;
            border-radius: 8px;
            background-color: #f5f5f5;
        }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
        #loginBtn {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 18px;
            background-color: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>慧铭AI语音助手 V5.6</h1>
    <p>Pi Network 测试网专属版本</p >

    <div class="status-box">
        <p id="status">点击下方按钮开始登录</p >
    </div>

    <button id="loginBtn">连接Pi网络并登录</button>

    <script>
        Pi.init({ version: "2.0", sandbox: true });

        function authenticateUser() {
            document.getElementById("status").innerText = "正在请求授权...";
            Pi.authenticate(
                ["username", "payments"],
                function onSuccess(authResult) {
                    document.getElementById("status").className = "success";
                    document.getElementById("status").innerText = 
                        "✅ 登录成功！用户ID：" + authResult.user.uid;
                    alert("登录成功！你的用户ID：" + authResult.user.uid);
                },
                function onError(error) {
                    document.getElementById("status").className = "error";
                    document.getElementById("status").innerText = 
                        "❌ 登录失败：" + error.message;
                    alert("登录失败：" + error.message);
                }
            );
        }

        document.getElementById("loginBtn").addEventListener("click", authenticateUser);
    </script>
</body>
</html>
